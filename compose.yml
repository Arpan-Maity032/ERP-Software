services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [backend]
  
  # user_service:
  #   build: ./services/user_global_service
  #   restart: unless-stopped
  #   environment:
  #     SERVICE_NAME: users
  #     PORT: 8000
  #     DB_HOST: mysql
  #     DB_NAME: USER_DB
  #     DB_USER: user_app
  #     DB_PASSWORD: ${USER_DB_PASSWORD}
  #     JWT_SECRET: ${JWT_SECRET}
  #     ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
  #   depends_on:
  #     mysql: { condition: service_healthy }
  #   networks: [backend]

  master_service:
    build: ./services/master-global-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: master
      PORT: 8001
      DB_HOST: mysql
      DB_NAME: MASTER_DB
      DB_USER: master_app
      DB_PASSWORD: ${MASTER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
    depends_on:
      mysql: { condition: service_healthy }
    networks: [backend]

  # store_service:
  #   build: ./services/store-inventory-service
  #   restart: unless-stopped
  #   environment:
  #     SERVICE_NAME: store
  #     PORT: 8002
  #     DB_HOST: mysql
  #     DB_NAME: STORE_DB
  #     DB_USER: store_app
  #     DB_PASSWORD: ${STORE_DB_PASSWORD}
  #     JWT_SECRET: ${JWT_SECRET}
  #     ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
  #   depends_on:
  #     mysql: { condition: service_healthy }
  #   networks: [backend]

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # - user_service
      - master_service
      # - store_service
    networks: [backend]

volumes:
  mysql_data:

networks:
  backend:
