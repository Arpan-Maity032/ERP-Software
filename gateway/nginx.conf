server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /api/v1/users/ {
        proxy_pass http://user_service:8000/api/v1/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/users {
        proxy_pass http://user_service:8000/api/v1/users;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- MASTER SERVICE (Port 8001) ---
    location /api/v1/master/ {
        proxy_pass http://master_service:8001/api/v1/master/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/master {
        proxy_pass http://master_service:8001/api/v1/master;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # # --- STORE SERVICE (Port 8002) ---
    # location /api/v1/store/ {
    #     proxy_pass http://store_service:8002/api/v1/store/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # location = /api/v1/store {
    #     proxy_pass http://store_service:8002/api/v1/store;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # --- HEALTH CHECKS ---
    # location /health/users { proxy_pass http://user_service:8000/health; }
    location /health/master { proxy_pass http://master_service:8001/health; }
    # location /health/store { proxy_pass http://store_service:8002/health; }

    # --- DEFAULT 404 ---
    location / {
        default_type application/json;
        return 404 '{"detail":"Route not found"}';
    }
}